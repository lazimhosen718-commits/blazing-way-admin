<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLAZING-WAY Food Rider Login</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Arial;color:#14213d}header{background:#102a56;color:white;text-align:center;padding:20px}main{max-width:480px;margin:24px auto;padding:14px}.card{background:white;padding:20px;border-radius:13px;box-shadow:0 3px 14px #0001}input,button{width:100%;padding:13px;margin:8px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}button{background:#1456a0;color:white;border:0;font-weight:bold}#msg{white-space:pre-wrap}</style></head><body><header><h1>BLAZING-WAY</h1><div>Food Rider Login</div></header><main><div class="card"><h2>Food Rider Login</h2><form id="f"><input id="email" type="email" placeholder="Gmail" required><input id="pass" type="password" placeholder="Password" required><button id="btn">Login</button></form><p id="msg"></p><a href="food-rider-register.html">নতুন Food Rider আবেদন</a><br><a href="index.html">মূল অ্যাপ</a></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";const $=id=>document.getElementById(id),app=initializeApp({apiKey:"AIzaSyBVzdXw-nO8ixDqxbGhTj3lbBX37XUMCr4",authDomain:"blazing-way.firebaseapp.com",projectId:"blazing-way",storageBucket:"blazing-way.firebasestorage.app",messagingSenderId:"100523779075",appId:"1:100523779075:web:732df54a1b0565f02e1a36"}),auth=getAuth(app),db=getFirestore(app);$("f").onsubmit=async e=>{e.preventDefault();$("btn").disabled=true;try{const u=(await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)).user,p=await getDoc(doc(db,"foodRiderProfiles",u.uid));if(!p.exists()||p.data().role!=="food_rider"){await signOut(auth);throw Error("এই অ্যাকাউন্ট Food Rider নয়।");}if(p.data().status!=="approved")throw Error("আপনার আবেদন এখনো অনুমোদিত হয়নি। Status: "+p.data().status);location.href="food-rider-dashboard.html";}catch(e){$("msg").textContent=e.message||"Login ব্যর্থ হয়েছে।";}finally{$("btn").disabled=false;}};</script></body></html>


<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLAZING-WAY Passenger Login</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#eef2f7;
 color:#172554;
}
header{
 background:#123b70;
 color:white;
 text-align:center;
 padding:22px;
}
main{
 max-width:480px;
 margin:25px auto;
 padding:15px;
}
.card{
 background:white;
 padding:22px;
 border-radius:12px;
 box-shadow:0 3px 12px #ddd;
}
input{
 width:100%;
 padding:14px;
 margin:9px 0;
 border:1px solid #ccc;
 border-radius:7px;
 font-size:16px;
}
button{
 width:100%;
 padding:14px;
 margin-top:12px;
 background:#123b70;
 color:white;
 border:0;
 border-radius:7px;
 font-size:16px;
 cursor:pointer;
}
button:disabled{opacity:.5}
.reset-btn{background:#16804a}
#message{
 overflow-wrap:anywhere;
 font-weight:bold;
}
a{color:#123b70}
</style>
</head>

<body>

<header>
<h1>BLAZING-WAY</h1>
<p>Passenger Login</p>
</header>

<main>
<div class="card">

<h2>যাত্রী অ্যাকাউন্টে Login করুন</h2>

<form id="loginForm">

<input id="email" type="email"
placeholder="আপনার Gmail" required>

<input id="password" type="password"
placeholder="আপনার Password" required>

<button id="loginBtn" type="submit">
Passenger Login
</button>

</form>

<button id="resetBtn" class="reset-btn" type="button">
Forgot Password? নতুন Password তৈরি করুন
</button>

<p id="message"></p>

<p>নতুন অ্যাকাউন্ট খুলতে
<a href="passenger-register.html">Registration করুন</a>
</p>

</div>
</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
sendPasswordResetEmail,
signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyBVzdXw-nO8ixDqxbGhTj3lbBX37XUMCr4",
authDomain:"blazing-way.firebaseapp.com",
projectId:"blazing-way",
storageBucket:"blazing-way.firebasestorage.app",
messagingSenderId:"100523779075",
appId:"1:100523779075:web:732df54a1b0565f02e1a36",
measurementId:"G-9V8GMD28ST"
});

const auth=getAuth(app);
const db=getFirestore(app);

const form=document.getElementById("loginForm");
const message=document.getElementById("message");
const loginBtn=document.getElementById("loginBtn");
const resetBtn=document.getElementById("resetBtn");
const emailInput=document.getElementById("email");


// PASSENGER LOGIN
form.addEventListener("submit",async(e)=>{

e.preventDefault();
message.textContent="";

const email=emailInput.value.trim();
const password=document.getElementById("password").value;

loginBtn.disabled=true;
loginBtn.textContent="Login হচ্ছে...";

try{

const result=await signInWithEmailAndPassword(
auth,email,password
);

const user=result.user;

const profileRef=doc(db,"passengerProfiles",user.uid);
const profileSnap=await getDoc(profileRef);

if(!profileSnap.exists() ||
profileSnap.data().role!=="passenger"){

await signOut(auth);
throw new Error("not-passenger");
}

message.style.color="green";
message.textContent="Passenger Login সফল হয়েছে!";

loginBtn.textContent="Dashboard খুলছে...";

// LOGIN সফল হলে Dashboard-এ পাঠাবে
window.location.replace("passenger-dashboard.html");

}catch(error){

console.error("Passenger Login Error:",error);

message.style.color="#b42318";

const errors={
"auth/invalid-credential":"Gmail অথবা Password ভুল।",
"auth/user-not-found":"এই Gmail দিয়ে অ্যাকাউন্ট পাওয়া যায়নি।",
"auth/wrong-password":"Password ভুল হয়েছে।",
"auth/invalid-email":"Gmail ঠিক নয়।",
"auth/network-request-failed":"ইন্টারনেট সংযোগ পরীক্ষা করুন।",
"not-passenger":"এই অ্যাকাউন্টটি Passenger অ্যাকাউন্ট নয়।"
};

message.textContent=
errors[error.message] ||
errors[error.code] ||
"সমস্যা হয়েছে: "+(error.code || error.message);

}finally{

loginBtn.disabled=false;
loginBtn.textContent="Passenger Login";

}

});


// FORGOT PASSWORD
resetBtn.addEventListener("click",async()=>{

message.textContent="";

const email=emailInput.value.trim();

if(!email){
message.style.color="#b42318";
message.textContent="প্রথমে আপনার Gmail লিখুন।";
emailInput.focus();
return;
}

resetBtn.disabled=true;
resetBtn.textContent="Reset Link পাঠানো হচ্ছে...";

try{

await sendPasswordResetEmail(auth,email);

message.style.color="green";
message.textContent=
"Password Reset লিংক আপনার Gmail-এ পাঠানো হয়েছে। Gmail Inbox অথবা Spam ফোল্ডার দেখুন।";

}catch(error){

console.error("Password Reset Error:",error);

message.style.color="#b42318";

const errors={
"auth/invalid-email":"Gmail ঠিক নয়।",
"auth/user-not-found":"এই Gmail দিয়ে অ্যাকাউন্ট পাওয়া যায়নি।",
"auth/network-request-failed":"ইন্টারনেট সংযোগ পরীক্ষা করুন।",
"auth/too-many-requests":"অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।"
};

message.textContent=
errors[error.code] ||
"Reset করতে সমস্যা হয়েছে: "+error.code;

}finally{

resetBtn.disabled=false;
resetBtn.textContent="Forgot Password? নতুন Password তৈরি করুন";

}

});

</script>

</body>
</html>

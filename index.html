
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLAZING-WAY Admin Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef2f7;color:#172554}
header{background:#123b70;color:white;text-align:center;padding:25px}
main{max-width:450px;margin:35px auto;padding:15px}
.card{background:white;padding:25px;border-radius:14px;box-shadow:0 3px 12px #ddd}
input{width:100%;padding:13px;margin:10px 0;border:1px solid #ccc;border-radius:7px}
button{width:100%;padding:13px;background:#123b70;color:white;border:0;border-radius:7px;margin-top:10px;font-size:16px}
#dashboard{display:none}
#message{color:#b42318;text-align:center}
</style>
</head>
<body>
<header>
<h1>BLAZING-WAY</h1>
<p>Admin Control Center</p>
</header>

<main>
<div class="card" id="login">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="message"></p>
</div>

<div class="card" id="dashboard">
<h2>স্বাগতম, Admin!</h2>
<p>Driver Applications</p>
<p>Passenger Management</p>
<p>Ride Monitoring</p>
<p>Commission: ৫%</p>
<button id="logoutBtn">Logout</button>
</div>
</main>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,getIdTokenResult}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyAV6za_TROkL0lSzdEPIWbMfRh00NR21KE",
authDomain: "blazing-way.firebaseapp.com",
projectId: "blazing-way",
storageBucket: "blazing-way.firebasestorage.app",
messagingSenderId: "100523779075",
appId: "1:100523779075:web:732df54a1b0565f02e1a36",
measurementId: "G-9V8GMD28ST"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

const login=document.getElementById("login");
const dashboard=document.getElementById("dashboard");
const message=document.getElementById("message");

document.getElementById("loginBtn").onclick=async()=>{
message.textContent="";
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

try{
await signInWithEmailAndPassword(auth,email,password);
}catch(error){
message.textContent="Login হয়নি। Email ও Password পরীক্ষা করুন।";
}
};

onAuthStateChanged(auth,async(user)=>{
if(!user){
login.style.display="block";
dashboard.style.display="none";
return;
}

try{
const token=await getIdTokenResult(user,true);

if(token.claims.admin===true){
login.style.display="none";
dashboard.style.display="block";
}else{
await signOut(auth);
message.textContent="এই অ্যাকাউন্টে Admin অনুমতি নেই।";
login.style.display="block";
dashboard.style.display="none";
}
}catch(error){
await signOut(auth);
message.textContent="অনুমতি যাচাই করা যায়নি।";
}
});

document.getElementById("logoutBtn").onclick=()=>{
signOut(auth);
};
</script>
</body>
</html>

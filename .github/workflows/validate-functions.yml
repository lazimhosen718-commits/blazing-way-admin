name: Validate BLAZING-WAY Cloud Functions

on:
  pull_request:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/validate-functions.yml'
  push:
    branches: [customer-app-v2.0]
    paths:
      - 'functions/**'
      - '.github/workflows/validate-functions.yml'

permissions:
  contents: read

jobs:
  syntax:
    name: Node.js 20 syntax validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Cloud Functions syntax
        run: npm run lint
      - name: Run ride settlement unit tests
        run: npm test

name: Build BLAZING-WAY Customer APK

on:
  push:
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-customer-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android-apk
        run: gradle assembleDebug
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: customer-apk-${{ github.run_number }}
          name: BLAZING-WAY Customer APK ${{ github.run_number }}
          files: android-apk/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

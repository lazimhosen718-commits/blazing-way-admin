<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102a56"><title>BLAZING-WAY | Food Customer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#14213d;font-family:Arial,sans-serif}header{background:#102a56;color:#fff;text-align:center;padding:20px}main{max-width:850px;margin:20px auto;padding:0 14px 35px}.card{background:#fff;border-radius:13px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0f172a12}input,button{width:100%;padding:13px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}button{background:#1456a0;color:#fff;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#475569}.food{border:1px solid #e2e8f0;padding:13px;border-radius:10px;margin:9px 0}.food h3{margin:0 0 5px}.muted{color:#64748b;line-height:1.5}.price{font-weight:bold;color:#087443}.row{display:flex;gap:8px;align-items:center}.row button{width:auto;min-width:100px}.hidden{display:none!important}#message{white-space:pre-wrap;overflow-wrap:anywhere}.ok{color:#087443}.err{color:#b42318}a{color:#1456a0}
</style></head><body>
<header><h1>BLAZING-WAY</h1><div>Food Delivery • Customer</div></header>
<main>
<section class="card" id="authCard"><h2>Food Customer Login / Registration</h2>
<form id="authForm"><input id="email" type="email" placeholder="Gmail" required><input id="password" type="password" placeholder="Password (কমপক্ষে ৬ অক্ষর)" minlength="6" required>
<div id="registerFields" class="hidden"><input id="fullName" placeholder="আপনার পূর্ণ নাম"><input id="phone" inputmode="numeric" placeholder="01XXXXXXXXX"></div>
<button id="authBtn">Login</button></form><button id="toggleRegister" class="secondary" type="button">নতুন Customer অ্যাকাউন্ট খুলুন</button><p id="authMessage"></p></section>
<section id="appArea" class="hidden">
<div class="card"><div class="row"><h2 style="flex:1">খাবারের Menu</h2><button id="refreshBtn" class="secondary">Refresh</button></div><p class="muted">একবারে একটি Merchant-এর খাবার অর্ডার করতে পারবেন।</p><div id="menuList">Menu লোড হচ্ছে...</div></div>
<div class="card"><h2>আপনার Cart</h2><div id="cartList">কার্ট খালি।</div><p id="cartTotal" class="price"></p><input id="address" placeholder="সম্পূর্ণ ডেলিভারি ঠিকানা"><input id="orderPhone" inputmode="numeric" placeholder="মোবাইল নম্বর 01XXXXXXXXX"><button id="placeOrderBtn">অর্ডার Confirm করুন</button></div>
<div class="card"><div class="row"><h2 style="flex:1">আমার অর্ডার</h2><button id="ordersRefresh" class="secondary">Refresh</button></div><div id="ordersList">অর্ডার লোড হচ্ছে...</div></div>
<button id="logoutBtn" class="secondary">Logout</button></section>
<p id="message"></p><p><a href="index.html">মূল অ্যাপে ফিরে যান</a></p>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
import {getFunctions,httpsCallable} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-functions.js";
const app=initializeApp({apiKey:"AIzaSyBVzdXw-nO8ixDqxbGhTj3lbBX37XUMCr4",authDomain:"blazing-way.firebaseapp.com",projectId:"blazing-way",storageBucket:"blazing-way.firebasestorage.app",messagingSenderId:"100523779075",appId:"1:100523779075:web:732df54a1b0565f02e1a36",measurementId:"G-9V8GMD28ST"});
const auth=getAuth(app),db=getFirestore(app),functions=getFunctions(app,"asia-south1");
const $=id=>document.getElementById(id);let registering=false,cart=new Map(),merchantForCart="";
const say=(id,msg,ok=false)=>{$(id).textContent=msg;$(id).className=ok?"ok":"err"};
$("toggleRegister").onclick=()=>{registering=!registering;$("registerFields").classList.toggle("hidden",!registering);$("authBtn").textContent=registering?"Registration":"Login";$("toggleRegister").textContent=registering?"আগে থেকেই অ্যাকাউন্ট আছে? Login":"নতুন Customer অ্যাকাউন্ট খুলুন";};
$("authForm").onsubmit=async e=>{e.preventDefault();say("authMessage","");$("authBtn").disabled=true;try{let user;if(registering){const name=$("fullName").value.trim(),phone=$("phone").value.trim();if(name.length<2||!/^01[3-9][0-9]{8}$/.test(phone))throw Error("নাম ও সঠিক বাংলাদেশি মোবাইল নম্বর দিন।");user=(await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)).user;await setDoc(doc(db,"foodCustomerProfiles",user.uid),{uid:user.uid,fullName:name,email:user.email,phone,role:"food_customer",createdAt:serverTimestamp()});}else{user=(await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)).user;const p=await getDoc(doc(db,"foodCustomerProfiles",user.uid));if(!p.exists()||p.data().role!=="food_customer"){await signOut(auth);throw Error("এই অ্যাকাউন্ট Food Customer নয়।");}}}catch(e){say("authMessage",e.message||"Login/Registration ব্যর্থ হয়েছে।");}finally{$("authBtn").disabled=false;}};
onAuthStateChanged(auth,async user=>{if(!user){$("authCard").classList.remove("hidden");$("appArea").classList.add("hidden");return;}try{const p=await getDoc(doc(db,"foodCustomerProfiles",user.uid));if(!p.exists()||p.data().role!=="food_customer"){await signOut(auth);say("authMessage","Food Customer profile পাওয়া যায়নি।");return;}$("authCard").classList.add("hidden");$("appArea").classList.remove("hidden");$("orderPhone").value=p.data().phone||"";await Promise.all([loadMenu(),loadOrders()]);}catch(e){say("message",e.message);}});
async function loadMenu(){ $("menuList").textContent="লোড হচ্ছে...";try{const snap=await getDocs(query(collection(db,"foodMenuItems"),where("available","==",true)));$("menuList").innerHTML="";if(snap.empty){$("menuList").textContent="এখনো কোনো খাবার যোগ করা হয়নি।";return;}snap.forEach(d=>{const x=d.data();const el=document.createElement("div");el.className="food";const h=document.createElement("h3");h.textContent=x.itemName;const p=document.createElement("p");p.className="muted";p.textContent=(x.merchantName||"Merchant")+" • "+(x.description||"");const price=document.createElement("p");price.className="price";price.textContent="৳"+x.price;const b=document.createElement("button");b.textContent="কার্টে যোগ করুন";b.onclick=()=>addCart(d.id,x);el.append(h,p,price,b);$("menuList").append(el);});}catch(e){$("menuList").textContent="Menu লোড করা যায়নি: "+e.message;}}
function addCart(id,x){if(merchantForCart&&merchantForCart!==x.merchantId){alert("একটি অর্ডারে এক Merchant-এর খাবার যোগ করা যাবে। আগে Cart খালি করুন।");return;}merchantForCart=x.merchantId;const old=cart.get(id)||{itemId:id,itemName:x.itemName,price:x.price,quantity:0};old.quantity++;cart.set(id,old);renderCart();}
function renderCart(){$("cartList").innerHTML="";if(!cart.size){$("cartList").textContent="কার্ট খালি।";$("cartTotal").textContent="";return;}let total=0;cart.forEach(x=>{total+=x.price*x.quantity;const d=document.createElement("div");d.className="food";d.textContent=x.itemName+" × "+x.quantity+" = ৳"+(x.price*x.quantity);const b=document.createElement("button");b.className="secondary";b.textContent="একটি কমান";b.onclick=()=>{x.quantity--;if(x.quantity<=0)cart.delete(x.itemId);if(!cart.size)merchantForCart="";renderCart();};d.append(b);$("cartList").append(d);});$("cartTotal").textContent="খাবারের মোট: ৳"+total;}
$("placeOrderBtn").onclick=async()=>{if(!cart.size){say("message","প্রথমে খাবার Cart-এ যোগ করুন।");return;}const address=$("address").value.trim(),phone=$("orderPhone").value.trim();if(!address||!/^01[3-9][0-9]{8}$/.test(phone)){say("message","সম্পূর্ণ ঠিকানা ও সঠিক মোবাইল নম্বর দিন।");return;}const b=$("placeOrderBtn");b.disabled=true;try{const call=httpsCallable(functions,"placeFoodOrder");const r=await call({merchantId:merchantForCart,deliveryAddress:address,customerPhone:phone,items:[...cart.values()].map(x=>({itemId:x.itemId,quantity:x.quantity}))});cart.clear();merchantForCart="";renderCart();say("message","অর্ডার সফল! Order ID: "+r.data.orderId+" | মোট ৳"+r.data.subtotal,true);await loadOrders();}catch(e){say("message",e.message||"অর্ডার করা যায়নি।");}finally{b.disabled=false;}};
async function loadOrders(){try{const snap=await getDocs(query(collection(db,"foodOrders"),where("customerId","==",auth.currentUser.uid)));$("ordersList").innerHTML="";if(snap.empty){$("ordersList").textContent="এখনো কোনো অর্ডার নেই।";return;}snap.forEach(d=>{const x=d.data(),el=document.createElement("div");el.className="food";const title=document.createElement("b");title.textContent=x.merchantName+" — ৳"+x.subtotal;const detail=document.createElement("p");detail.textContent="Order: "+d.id+" | অবস্থা: "+x.status+" | "+(x.items||[]).map(i=>i.itemName+" × "+i.quantity).join(", ");el.append(title,detail);$("ordersList").append(el);});}catch(e){$("ordersList").textContent="অর্ডার লোড করা যায়নি: "+e.message;}}
$("refreshBtn").onclick=loadMenu;$("ordersRefresh").onclick=loadOrders;$("logoutBtn").onclick=()=>signOut(auth);
</script></body></html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLAZING-WAY Food Rider</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#14213d;font-family:Arial}header{background:#102a56;color:white;text-align:center;padding:18px}main{max-width:850px;margin:18px auto;padding:0 13px 30px}.card,.item{background:white;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 2px 10px #0001}.item{border:1px solid #dbe3ee;box-shadow:none}button{width:100%;padding:12px;margin:6px 0;border:0;border-radius:8px;background:#1456a0;color:white;font-size:16px;font-weight:bold}.alt{background:#475569}.muted{color:#64748b;white-space:pre-line;line-height:1.5}.hidden{display:none}#msg{white-space:pre-wrap}</style></head><body><header><h1>BLAZING-WAY</h1>Food Delivery Rider Panel</header><main><section class="card" id="wait"><h2>Food Rider Panel</h2><p id="state">অ্যাকাউন্ট যাচাই হচ্ছে...</p><a href="food-rider-login.html">Login</a> | <a href="food-rider-register.html">নতুন আবেদন</a></section><section id="panel" class="hidden"><div class="card"><h2 id="name">Food Rider</h2><p id="approval">Approved</p><h3 id="wallet">Wallet লোড হচ্ছে...</h3><p class="muted">প্রতিটি বরাদ্দকৃত ডেলিভারি গ্রহণ করলে একবার ৳১ কাটা হবে।</p><button id="refresh" class="alt">Refresh</button></div><div class="card"><h2>আমার ডেলিভারি</h2><div id="orders">লোড হচ্ছে...</div></div><button id="logout" class="alt">Logout</button></section><p id="msg"></p><a href="index.html">মূল অ্যাপে ফিরে যান</a></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";import{getFirestore,doc,getDoc,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";import{getFunctions,httpsCallable}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-functions.js";
const app=initializeApp({apiKey:"AIzaSyBVzdXw-nO8ixDqxbGhTj3lbBX37XUMCr4",authDomain:"blazing-way.firebaseapp.com",projectId:"blazing-way",storageBucket:"blazing-way.firebasestorage.app",messagingSenderId:"100523779075",appId:"1:100523779075:web:732df54a1b0565f02e1a36"}),auth=getAuth(app),db=getFirestore(app),fn=getFunctions(app,"asia-south1"),$=id=>document.getElementById(id);let uid="";const say=m=>$("msg").textContent=m;
onAuthStateChanged(auth,async u=>{if(!u){$("wait").classList.remove("hidden");$("panel").classList.add("hidden");$("state").textContent="প্রথমে Rider Login করুন।";return;}uid=u.uid;try{const p=await getDoc(doc(db,"foodRiderProfiles",uid));if(!p.exists()||p.data().role!=="food_rider"){await signOut(auth);say("এই অ্যাকাউন্ট Food Rider নয়।");return;}if(p.data().status!=="approved"){$("state").textContent="আবেদনের অবস্থা: "+p.data().status+"। Admin অনুমোদনের অপেক্ষা করুন।";return;}$("wait").classList.add("hidden");$("panel").classList.remove("hidden");$("name").textContent=(p.data().fullName||"Food Rider")+" — Rider Panel";await refreshAll();}catch(e){say(e.message);}});
async function refreshAll(){await Promise.all([loadWallet(),loadOrders()]);}
async function loadWallet(){const s=await getDoc(doc(db,"foodRiderWallets",uid));$("wallet").textContent="Rider Wallet: ৳"+(s.exists()?Number(s.data().balance||0).toFixed(2):"0.00");}
async function loadOrders(){const [a,b]=await Promise.all([getDocs(query(collection(db,"foodOrders"),where("assignedRiderId","==",uid))),getDocs(query(collection(db,"foodOrders"),where("riderId","==",uid)))]);const m=new Map();a.forEach(d=>m.set(d.id,d));b.forEach(d=>m.set(d.id,d));$("orders").replaceChildren();if(!m.size){$("orders").textContent="এখনো কোনো ডেলিভারি বরাদ্দ হয়নি।";return;}for(const [id,s] of m){const x=s.data(),c=document.createElement("div");c.className="item";const h=document.createElement("h3");h.textContent="Order "+id+" — "+x.status;const p=document.createElement("p");p.className="muted";p.textContent="খাবার: "+(x.items||[]).map(i=>i.itemName+" × "+i.quantity).join(", ")+"\nঠিকানা: "+(x.deliveryAddress||"")+"\nCustomer ফোন: "+(x.customerPhone||"");c.append(h,p);const action=(label,status)=>{const z=document.createElement("button");z.textContent=label;z.onclick=async()=>{z.disabled=true;try{await httpsCallable(fn,status==="accept"?"acceptFoodDeliveryAssignment":"updateFoodDeliveryStatus")({orderId:id,...(status==="accept"?{}:{status})});say("অর্ডার আপডেট হয়েছে।");await refreshAll();}catch(e){say(e.message);z.disabled=false;}};c.append(z);};if(x.assignedRiderId===uid&&!x.riderAcceptedAt&&["ready","rider_assigned"].includes(x.status))action("ডেলিভারি গ্রহণ করুন (৳১ ফি)","accept");if(x.riderId===uid&&x.status==="rider_assigned")action("খাবার Pickup করেছি","picked_up");if(x.riderId===uid&&x.status==="picked_up")action("Customer-কে Delivered করুন","delivered");$("orders").append(c);}}
$("refresh").onclick=()=>refreshAll().catch(e=>say(e.message));$("logout").onclick=()=>signOut(auth);
</script></body></html>

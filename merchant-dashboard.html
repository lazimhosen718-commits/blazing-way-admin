<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BLAZING-WAY Merchant Panel</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#14213d;font-family:Arial}header{background:#102a56;color:white;text-align:center;padding:18px}main{max-width:850px;margin:18px auto;padding:0 13px 30px}.card{background:white;padding:17px;border-radius:12px;margin:13px 0;box-shadow:0 3px 12px #0001}input,textarea,button{width:100%;padding:12px;margin:6px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}button{background:#1456a0;color:white;border:0;font-weight:bold}.alt{background:#475569}.item{border:1px solid #e2e8f0;border-radius:9px;padding:12px;margin:9px 0}.muted{color:#64748b;white-space:pre-wrap}#msg{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><header><h1>BLAZING-WAY</h1><div>Merchant Control Panel</div></header><main><div class="card"><h2 id="shop">আপনার দোকান</h2><p id="wallet">Wallet: লোড হচ্ছে...</p><p class="muted">প্রতিটি নতুন অর্ডার গ্রহণ করলে Merchant Wallet থেকে ৳১ কাটা হবে।</p><button id="refresh" class="alt">Refresh</button></div><div class="card"><h2>Menu-তে খাবার যোগ করুন</h2><form id="menuForm"><input id="name" placeholder="খাবারের নাম" required><textarea id="desc" placeholder="খাবারের বিবরণ"></textarea><input id="price" type="number" min="1" step="0.01" placeholder="দাম (৳)" required><button id="save">Menu-তে যোগ করুন</button></form><h3>আমার Menu</h3><div id="menuList"></div></div><div class="card"><h2>নতুন ও চলমান অর্ডার</h2><div id="orders"></div></div><p id="msg"></p><button id="logout" class="alt">Logout</button><a href="index.html">মূল অ্যাপ</a></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";import{getFirestore,getDoc,doc,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";import{getFunctions,httpsCallable}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-functions.js";const app=initializeApp({apiKey:"AIzaSyBVzdXw-nO8ixDqxbGhTj3lbBX37XUMCr4",authDomain:"blazing-way.firebaseapp.com",projectId:"blazing-way",storageBucket:"blazing-way.firebasestorage.app",messagingSenderId:"100523779075",appId:"1:100523779075:web:732df54a1b0565f02e1a36"}),auth=getAuth(app),db=getFirestore(app),fn=getFunctions(app,"asia-south1"),$=id=>document.getElementById(id);let uid="";const say=m=>{$("msg").textContent=m};onAuthStateChanged(auth,async u=>{if(!u){location.replace("merchant-login.html");return;}uid=u.uid;try{const p=await getDoc(doc(db,"merchantProfiles",uid));if(!p.exists()||p.data().status!=="approved"){say("Merchant অনুমোদিত নয়।");await signOut(auth);return;}$("shop").textContent=p.data().businessName+" — Merchant Panel";await refreshAll();}catch(e){say(e.message);}});async function refreshAll(){await Promise.all([loadMenu(),loadOrders(),loadWallet()]);}async function loadWallet(){try{const s=await getDoc(doc(db,"merchantWallets",uid));$("wallet").textContent="Merchant Wallet: ৳"+(s.exists()?Number(s.data().balance||0):0);}catch(e){$("wallet").textContent="Wallet দেখা যাচ্ছে না: "+e.message;}}async function loadMenu(){const s=await getDocs(query(collection(db,"foodMenuItems"),where("merchantId","==",uid)));$("menuList").innerHTML="";if(s.empty){$("menuList").textContent="এখনো Menu নেই।";return;}s.forEach(d=>{const x=d.data(),el=document.createElement("div");el.className="item";el.textContent=x.itemName+" — ৳"+x.price+" — "+(x.available?"Available":"Unavailable");const b=document.createElement("button");b.className="alt";b.textContent=x.available?"Unavailable করুন":"Available করুন";b.onclick=async()=>{try{await httpsCallable(fn,"saveFoodMenuItem")({itemId:d.id,itemName:x.itemName,description:x.description||"",price:x.price,available:!x.available});await loadMenu();}catch(e){say(e.message);}};el.append(b);$("menuList").append(el);});}async function loadOrders(){const s=await getDocs(query(collection(db,"foodOrders"),where("merchantId","==",uid)));$("orders").innerHTML="";if(s.empty){$("orders").textContent="এখনো কোনো অর্ডার নেই।";return;}s.forEach(d=>{const x=d.data(),el=document.createElement("div");el.className="item";const title=document.createElement("b");title.textContent="Order "+d.id+" — ৳"+x.subtotal+" — "+x.status;const details=document.createElement("p");details.className="muted";details.textContent=(x.items||[]).map(i=>i.itemName+" × "+i.quantity).join("\n")+"\nঠিকানা: "+x.deliveryAddress+"\nফোন: "+x.customerPhone;el.append(title,details);const add=(label,fn)=>{const b=document.createElement("button");b.textContent=label;b.onclick=async()=>{b.disabled=true;try{await fn();say("অর্ডার আপডেট হয়েছে।");await refreshAll();}catch(e){say(e.message);}finally{b.disabled=false;}};el.append(b);};if(x.status==="pending")add("অর্ডার গ্রহণ করুন (৳১ ফি)",()=>httpsCallable(fn,"acceptFoodOrder")({orderId:d.id}));if(x.status==="accepted")add("Preparing করুন",()=>httpsCallable(fn,"updateFoodOrderPreparationStatus")({orderId:d.id,status:"preparing"}));if(x.status==="preparing")add("Ready করুন",()=>httpsCallable(fn,"updateFoodOrderPreparationStatus")({orderId:d.id,status:"ready"}));$("orders").append(el);});}$("menuForm").onsubmit=async e=>{e.preventDefault();$("save").disabled=true;try{await httpsCallable(fn,"saveFoodMenuItem")({itemName:$("name").value.trim(),description:$("desc").value.trim(),price:Number($("price").value),available:true});$("menuForm").reset();say("খাবার Menu-তে যোগ হয়েছে।");await loadMenu();}catch(e){say(e.message);}finally{$("save").disabled=false;}};$("refresh").onclick=refreshAll;$("logout").onclick=()=>signOut(auth);</script></body></html>

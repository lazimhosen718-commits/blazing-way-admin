<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLAZING-WAY Food Rider আবেদন</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Arial;color:#14213d}header{background:#102a56;color:white;text-align:center;padding:20px}main{max-width:520px;margin:22px auto;padding:14px}.card{background:white;padding:20px;border-radius:13px;box-shadow:0 3px 14px #0001}input,button{width:100%;padding:13px;margin:8px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}button{background:#1456a0;color:white;border:0;font-weight:bold}#msg{white-space:pre-wrap}</style></head><body><header><h1>BLAZING-WAY</h1><div>Food Rider Registration</div></header><main><div class="card"><h2>Food Rider আবেদন</h2><p>আবেদন জমা হলে Admin অনুমোদনের পর ডেলিভারি গ্রহণ করতে পারবেন।</p><form id="f"><input id="name" placeholder="পূর্ণ নাম" required><input id="phone" inputmode="numeric" placeholder="মোবাইল 01XXXXXXXXX" required><input id="email" type="email" placeholder="Gmail" required><input id="pass" type="password" minlength="6" placeholder="Password (কমপক্ষে ৬ অক্ষর)" required><button id="btn">আবেদন জমা দিন</button></form><p id="msg"></p><a href="food-rider-login.html">Rider Login</a><br><a href="index.html">মূল অ্যাপ</a></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";import{getAuth,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";import{getFirestore,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";const $=id=>document.getElementById(id),app=initializeApp({apiKey:"AIzaSyBVzdXw-nO8ixDqxbGhTj3lbBX37XUMCr4",authDomain:"blazing-way.firebaseapp.com",projectId:"blazing-way",storageBucket:"blazing-way.firebasestorage.app",messagingSenderId:"100523779075",appId:"1:100523779075:web:732df54a1b0565f02e1a36"}),auth=getAuth(app),db=getFirestore(app);$("f").onsubmit=async e=>{e.preventDefault();$("btn").disabled=true;try{const phone=$("phone").value.trim();if(!/^01[3-9][0-9]{8}$/.test(phone))throw Error("সঠিক বাংলাদেশি মোবাইল নম্বর দিন।");const u=(await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)).user;await setDoc(doc(db,"foodRiderProfiles",u.uid),{uid:u.uid,fullName:$("name").value.trim(),email:u.email,phone,role:"food_rider",status:"pending",createdAt:serverTimestamp()});$("msg").textContent="আবেদন জমা হয়েছে। Admin অনুমোদনের অপেক্ষা করুন।";$("msg").style.color="green";}catch(e){$("msg").textContent=e.message||"আবেদন ব্যর্থ হয়েছে।";}finally{$("btn").disabled=false;}};</script></body></html>

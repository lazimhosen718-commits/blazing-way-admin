
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLAZING-WAY Passenger Dashboard</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#eef2f7;
 color:#172554;
}
header{
 background:#123b70;
 color:white;
 padding:20px;
 text-align:center;
}
header h1{margin:0}
main{
 max-width:650px;
 margin:20px auto;
 padding:15px;
}
.card{
 background:white;
 padding:20px;
 margin-bottom:16px;
 border-radius:12px;
 box-shadow:0 3px 12px #ddd;
}
input,select{
 width:100%;
 padding:13px;
 margin:8px 0;
 border:1px solid #ccc;
 border-radius:7px;
 font-size:16px;
}
button{
 width:100%;
 padding:14px;
 margin-top:10px;
 border:0;
 border-radius:7px;
 background:#123b70;
 color:white;
 font-size:16px;
 cursor:pointer;
}
button:disabled{
 opacity:.6;
 cursor:not-allowed;
}
.logout{background:#b42318}
#fare{
 font-size:25px;
 font-weight:bold;
 color:#087443;
}
.small{color:#64748b;font-size:13px}
#bookingMessage{
 font-size:14px;
 line-height:1.6;
}
</style>
</head>

<body>

<header>
<h1>BLAZING-WAY</h1>
<p>Passenger Dashboard</p>
</header>

<main>

<div class="card">
<h2>স্বাগতম!</h2>
<p id="passengerName">তথ্য লোড হচ্ছে...</p>
<p id="passengerEmail"></p>
<button class="logout" id="logoutBtn">Logout</button>
</div>

<div class="card">
<h2>আপনার যাত্রা পরিকল্পনা করুন</h2>

<label>কোথা থেকে যাত্রা শুরু করবেন?</label>
<input id="pickup" type="text"
placeholder="যাত্রা শুরুর স্থান লিখুন">

<label>কোথায় যাবেন?</label>
<input id="destination" type="text"
placeholder="গন্তব্য লিখুন">

<label>যানবাহন নির্বাচন করুন</label>
<select id="vehicle">
<option value="bike">Bike</option>
<option value="car">Private Car</option>
</select>

<label>আনুমানিক দূরত্ব (কিলোমিটার)</label>
<input id="distance" type="number"
min="0.1" max="200" step="0.1"
placeholder="যেমন: 5">

<button id="calculateBtn">
ভাড়া হিসাব করুন
</button>

<hr>

<h3>আনুমানিক ভাড়া</h3>
<p id="fare">৳০</p>
<p class="small" id="fareDetails">
দূরত্ব ও যানবাহন নির্বাচন করে ভাড়া হিসাব করুন।
</p>

<p class="small">
এটি প্রাথমিক আনুমানিক হিসাব। প্রকৃত ভাড়া পরিবর্তিত হতে পারে।
</p>

<button id="bookingBtn" disabled>
Ride Booking করুন
</button>

<p id="bookingMessage" class="small"></p>
</div>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyBVzdXw-nO8ixDqxbGhTj3lbBX37XUMCr4",
authDomain:"blazing-way.firebaseapp.com",
projectId:"blazing-way",
storageBucket:"blazing-way.firebasestorage.app",
messagingSenderId:"100523779075",
appId:"1:100523779075:web:732df54a1b0565f02e1a36",
measurementId:"G-9V8GMD28ST"
});

const auth=getAuth(app);
const db=getFirestore(app);

const nameBox=document.getElementById("passengerName");
const emailBox=document.getElementById("passengerEmail");
const fareBox=document.getElementById("fare");
const fareDetails=document.getElementById("fareDetails");
const bookingBtn=document.getElementById("bookingBtn");
const bookingMessage=document.getElementById("bookingMessage");

let passengerReady=false;

function calculateFare(){

const vehicle=document.getElementById("vehicle").value;
const distance=Number(document.getElementById("distance").value);

if(!Number.isFinite(distance) || distance<=0 || distance>200){
throw new Error("দূরত্ব ০-এর বেশি এবং সর্বোচ্চ ২০০ কিলোমিটার হতে হবে।");
}

const base=vehicle==="bike"?30:60;
const rate=vehicle==="bike"?12:20;

const total=Math.round(base+(distance*rate));

return {
vehicle,
distance,
total,
base
};

}

onAuthStateChanged(auth,async(user)=>{

passengerReady=false;
bookingBtn.disabled=true;

if(!user){
window.location.replace("passenger-login.html");
return;
}

try{

const profileRef=doc(db,"passengerProfiles",user.uid);
const profileSnap=await getDoc(profileRef);

if(!profileSnap.exists() ||
profileSnap.data().role!=="passenger"){

await signOut(auth);
window.location.replace("passenger-login.html");
return;

}

const profile=profileSnap.data();

nameBox.textContent="নাম: "+profile.fullName;
emailBox.textContent="Gmail: "+profile.email;

passengerReady=true;
bookingBtn.disabled=false;

}catch(error){

console.error(error);
nameBox.textContent="প্রোফাইল লোড করা যায়নি।";
bookingMessage.textContent="ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।";

}

});

document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

try{
await signOut(auth);
window.location.replace("passenger-login.html");
}catch(error){
alert("Logout করা যায়নি। আবার চেষ্টা করুন।");
}

});

document.getElementById("calculateBtn")
.addEventListener("click",()=>{

const pickup=document.getElementById("pickup").value.trim();
const destination=document.getElementById("destination").value.trim();

if(!pickup || !destination){
alert("যাত্রা শুরুর স্থান ও গন্তব্য লিখুন।");
return;
}

try{

const result=calculateFare();

fareBox.textContent="৳"+result.total;

fareDetails.textContent=
"মূল ভাড়া ৳"+result.base+
" + দূরত্বভাড়া ৳"+Math.round(result.distance*(result.vehicle==="bike"?12:20))+
" ("+result.distance+" কিমি)";

bookingMessage.textContent="";

}catch(error){
alert(error.message);
}

});

bookingBtn.addEventListener("click",async()=>{

if(!passengerReady || !auth.currentUser){
bookingMessage.textContent="প্রথমে Passenger Login করুন।";
return;
}

const pickup=document.getElementById("pickup").value.trim();
const destination=document.getElementById("destination").value.trim();

if(pickup.length<2 || destination.length<2){
bookingMessage.textContent="যাত্রার স্থান ও গন্তব্য সঠিকভাবে লিখুন।";
return;
}

let result;

try{
result=calculateFare();
}catch(error){
bookingMessage.textContent=error.message;
return;
}

bookingBtn.disabled=true;
bookingBtn.textContent="Booking হচ্ছে...";
bookingMessage.textContent="আপনার বুকিং জমা হচ্ছে...";

try{

const bookingData={
passengerId:auth.currentUser.uid,
pickup:pickup,
destination:destination,
vehicleType:result.vehicle,
distanceKm:result.distance,
estimatedFare:result.total,
status:"pending",
createdAt:serverTimestamp()
};

const bookingRef=await addDoc(
collection(db,"rideBookings"),
bookingData
);

bookingMessage.textContent=
"অভিনন্দন! আপনার Ride Booking সফল হয়েছে।"+
" বুকিং নম্বর: "+bookingRef.id+
" | Status: Pending";

}catch(error){

console.error("Booking Error:",error);

bookingMessage.textContent=
"বুকিং করা যায়নি। আবার চেষ্টা করুন। Error: "+error.code;

}finally{

bookingBtn.disabled=!passengerReady;
bookingBtn.textContent="Ride Booking করুন";

}

});

</script>

</body>
</html>

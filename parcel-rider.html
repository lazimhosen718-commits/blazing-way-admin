<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLAZING-WAY Parcel Rider</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#172554}header{background:#123b70;color:#fff;padding:20px;text-align:center}main{max-width:650px;margin:20px auto;padding:12px}.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:14px}input{width:100%;padding:13px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px}button{width:100%;padding:13px;margin-top:8px;border:0;border-radius:8px;background:#123b70;color:#fff;font-size:16px}.order{padding:13px;border:1px solid #dbe3ef;border-radius:10px;margin:10px 0}.muted{color:#64748b;font-size:13px}</style></head>
<body><header><h2>📦 BLAZING-WAY Parcel Rider</h2><p>Parcel ও Business Delivery Rider Portal</p></header><main>
<section class="card" id="loginBox"><h3>Rider Login</h3><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="loginMsg" class="muted"></p><hr><h3>নতুন Rider আবেদন</h3><input id="name" placeholder="পূর্ণ নাম"><input id="phone" inputmode="numeric" placeholder="01XXXXXXXXX"><input id="newEmail" type="email" placeholder="Email"><input id="newPassword" type="password" placeholder="কমপক্ষে ৬ অক্ষরের Password"><button id="applyBtn">Rider Account তৈরি ও আবেদন</button><p class="muted">আবেদন Admin অনুমোদন না করা পর্যন্ত অর্ডার পাওয়া যাবে না।</p></section>
<section class="card" id="dashboard" style="display:none"><h3 id="welcome">Rider Dashboard</h3><p id="riderStatus"></p><button id="refreshBtn">Orders Refresh</button><div id="orders">লোড হচ্ছে...</div><button id="logoutBtn" style="background:#b42318">Logout</button></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,collection,query,where,onSnapshot,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBVzdXw-nO8ixDqxbGhTj3lbBX37XUMCr4",authDomain:"blazing-way.firebaseapp.com",projectId:"blazing-way",storageBucket:"blazing-way.firebasestorage.app",messagingSenderId:"100523779075",appId:"1:100523779075:web:732df54a1b0565f02e1a36"});
const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let stopOrders=null;
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);}catch(e){$("loginMsg").textContent="Login হয়নি: "+e.message;}};
$("applyBtn").onclick=async()=>{const name=$("name").value.trim(),phone=$("phone").value.trim(),email=$("newEmail").value.trim(),password=$("newPassword").value;if(name.length<2||!/^01[3-9][0-9]{8}$/.test(phone)||!email||password.length<6){$("loginMsg").textContent="সঠিক নাম, মোবাইল, Email ও ৬ অক্ষরের Password দিন।";return;}try{const c=await createUserWithEmailAndPassword(auth,email,password);await setDoc(doc(db,"parcelRiderProfiles",c.user.uid),{uid:c.user.uid,fullName:name,email,phone,role:"parcel_rider",status:"pending",createdAt:serverTimestamp()});$("loginMsg").textContent="আবেদন জমা হয়েছে। Admin অনুমোদনের অপেক্ষা করুন।";}catch(e){$("loginMsg").textContent="আবেদন হয়নি: "+e.message;}};
function loadOrders(uid){if(stopOrders)stopOrders();const box=$("orders");box.textContent="অর্ডার লোড হচ্ছে...";const refs=[["parcelOrders","Parcel"],["businessDeliveryOrders","Business Delivery"]];let snapshots={};function draw(){box.replaceChildren();for(const [col,label]of refs){for(const x of snapshots[col]||[]){const d=x.data(),card=document.createElement("div");card.className="order";const p=document.createElement("p");p.textContent=label+" • "+(d.status||"pending");const route=document.createElement("p");route.textContent=(d.pickupAddress||"")+" → "+(d.deliveryAddress||"");card.append(p,route);if(["accepted","picked_up","in_transit"].includes(d.status)){const next=d.status==="accepted"?"picked_up":d.status==="picked_up"?"in_transit":"delivered";const b=document.createElement("button");b.textContent=next==="delivered"?"Delivered":"Update: "+next;b.onclick=async()=>{b.disabled=true;try{await updateDoc(doc(db,col,x.id),{status:next,updatedAt:serverTimestamp()});}catch(e){alert("আপডেট হয়নি: "+e.message);}finally{b.disabled=false;}};card.append(b);}box.append(card);}}if(!box.children.length)box.textContent="এখনো কোনো Assigned Order নেই।";}
const stops=refs.map(([col])=>onSnapshot(query(collection(db,col),where("assignedRiderId","==",uid)),s=>{snapshots[col]=s.docs;draw();},e=>{box.textContent="Order load error: "+e.code;}));stopOrders=()=>stops.forEach(f=>f());}
onAuthStateChanged(auth,async user=>{if(stopOrders){stopOrders();stopOrders=null;}if(!user){$("loginBox").style.display="block";$("dashboard").style.display="none";return;}try{const s=await getDoc(doc(db,"parcelRiderProfiles",user.uid));if(!s.exists()||s.data().role!=="parcel_rider"){await signOut(auth);$("loginMsg").textContent="এই Account Parcel Rider নয়।";return;}const x=s.data();$("loginBox").style.display="none";$("dashboard").style.display="block";$("welcome").textContent="স্বাগতম, "+x.fullName;$("riderStatus").textContent="Application Status: "+x.status;if(x.status==="approved")loadOrders(user.uid);else $("orders").textContent="Admin অনুমোদনের পর Assigned Order দেখতে পারবেন।";}catch(e){$("loginMsg").textContent="Profile load হয়নি: "+e.message;}});
$("refreshBtn").onclick=()=>{if(auth.currentUser)loadOrders(auth.currentUser.uid);};$("logoutBtn").onclick=()=>signOut(auth);
</script></body></html>

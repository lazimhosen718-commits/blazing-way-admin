
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLAZING-WAY Driver Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef2f7;color:#172554}
header{background:#123b70;color:white;text-align:center;padding:20px}
main{max-width:500px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:12px;box-shadow:0 3px 12px #ddd}
input{width:100%;padding:13px;margin:10px 0;border:1px solid #ccc;border-radius:7px}
button{background:#123b70;color:white;border:0;padding:13px;border-radius:7px;width:100%;margin-top:12px}
#result{margin-top:18px;line-height:1.7;overflow-wrap:anywhere}
.approved{color:green;font-weight:bold}
.pending{color:#a15c00;font-weight:bold}
.rejected{color:#b42318;font-weight:bold}
a{color:#123b70}
</style>
</head>
<body>

<header>
<h1>BLAZING-WAY</h1>
<p>Driver Login</p>
</header>

<main>
<div class="card">
<h2>চালক Login</h2>

<form id="loginForm">
<label>Gmail</label>
<input id="email" type="email" required>

<label>Password</label>
<input id="password" type="password" required>

<button id="loginBtn" type="submit">Login</button>
</form>

<div id="result"></div>
<button id="logoutBtn" hidden>Logout</button>

<p><a href="driver-register.html">নতুন চালক নিবন্ধন</a></p>
</div>
</main>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAV6za_TROkL0lSzdEPIWbMfRh00NR21KE",
authDomain:"blazing-way.firebaseapp.com",
projectId:"blazing-way",
storageBucket:"blazing-way.firebasestorage.app",
messagingSenderId:"100523779075",
appId:"1:100523779075:web:732df54a1b0565f02e1a36"
});

const auth=getAuth(app);
const db=getFirestore(app);

const form=document.getElementById("loginForm");
const result=document.getElementById("result");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");

async function checkDriver(user){

form.hidden=true;
logoutBtn.hidden=false;
result.textContent="আবেদনের অবস্থা যাচাই হচ্ছে...";

try{

const ref=doc(db,"driverApplications",user.uid);
const snap=await getDoc(ref);

if(!snap.exists()){
result.textContent="এই অ্যাকাউন্টে চালকের আবেদন পাওয়া যায়নি।";
return;
}

const data=snap.data();

if(data.status==="approved"){

result.innerHTML="";
const title=document.createElement("h3");
title.className="approved";
title.textContent="আপনার আবেদন অনুমোদিত হয়েছে!";

const info=document.createElement("p");
info.textContent="স্বাগতম, "+(data.fullName || "চালক")+"। আপনার গাড়ির ধরন: "+
(data.vehicleType==="bike" ? "Bike" : "Private Car");

const next=document.createElement("p");
next.textContent="আপনি অনুমোদিত চালক। রাইড গ্রহণের ব্যবস্থা এখনো তৈরি হচ্ছে।";

result.append(title,info,next);

}else if(data.status==="pending"){

result.innerHTML="";
const status=document.createElement("h3");
status.className="pending";
status.textContent="আপনার আবেদন এখনো Pending।";

const info=document.createElement("p");
info.textContent="Admin অনুমোদন না দেওয়া পর্যন্ত আপনি রাইড নিতে পারবেন না।";

result.append(status,info);

}else if(data.status==="rejected"){

result.innerHTML="";
const status=document.createElement("h3");
status.className="rejected";
status.textContent="আপনার আবেদন অনুমোদিত হয়নি।";

const info=document.createElement("p");
info.textContent="বিস্তারিত জানতে Admin-এর সঙ্গে যোগাযোগ করুন।";

result.append(status,info);

}else{

result.textContent="আবেদনের অবস্থা পাওয়া যায়নি। Admin-এর সঙ্গে যোগাযোগ করুন।";

}

}catch(error){

console.error(error);
result.textContent="আবেদনের অবস্থা যাচাই করা যায়নি। আবার চেষ্টা করুন।";

}

}

form.addEventListener("submit",async(event)=>{

event.preventDefault();
result.textContent="";
loginBtn.disabled=true;

try{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

const credential=await signInWithEmailAndPassword(
auth,email,password
);

await checkDriver(credential.user);

}catch(error){

console.error(error);
result.textContent="Login হয়নি। Gmail ও Password পরীক্ষা করুন।";

}finally{

loginBtn.disabled=false;

}

});

onAuthStateChanged(auth,user=>{

if(!user){
form.hidden=false;
logoutBtn.hidden=true;
result.textContent="";
}

});

logoutBtn.onclick=async()=>{

await signOut(auth);
form.reset();

};

</script>
</body>
</html>


<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLAZING-WAY Driver Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef2f7;color:#172554}
header{background:#123b70;color:white;text-align:center;padding:20px}
main{max-width:500px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:12px;box-shadow:0 3px 12px #ddd}
input{width:100%;padding:13px;margin:10px 0;border:1px solid #ccc;border-radius:7px}
button{background:#123b70;color:white;border:0;padding:13px;border-radius:7px;width:100%;margin-top:12px}
button:disabled{opacity:.5}
#result{margin-top:18px;line-height:1.7;overflow-wrap:anywhere}
.approved{color:green;font-weight:bold}
.pending{color:#a15c00;font-weight:bold}
.rejected{color:#b42318;font-weight:bold}
.online{color:green;font-weight:bold}
.offline{color:#b42318;font-weight:bold}
a{color:#123b70}
</style>
</head>
<body>

<header>
<h1>BLAZING-WAY</h1>
<p>Driver Login</p>
</header>

<main>
<div class="card">
<h2>চালক Login</h2>

<form id="loginForm">
<label>Gmail</label>
<input id="email" type="email" required>

<label>Password</label>
<input id="password" type="password" required>

<button id="loginBtn" type="submit">Login</button>
</form>

<div id="result"></div>

<button id="onlineBtn" hidden>Online হোন</button>
<button id="logoutBtn" hidden>Logout</button>

<p><a href="driver-register.html">নতুন চালক নিবন্ধন</a></p>
</div>
</main>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAV6za_TROkL0lSzdEPIWbMfRh00NR21KE",
authDomain:"blazing-way.firebaseapp.com",
projectId:"blazing-way",
storageBucket:"blazing-way.firebasestorage.app",
messagingSenderId:"100523779075",
appId:"1:100523779075:web:732df54a1b0565f02e1a36"
});

const auth=getAuth(app);
const db=getFirestore(app);

const form=document.getElementById("loginForm");
const result=document.getElementById("result");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const onlineBtn=document.getElementById("onlineBtn");

let currentDriver=null;
let currentOnline=false;
let busy=false;

function showMessage(text,className=""){
result.replaceChildren();
const p=document.createElement("p");
p.className=className;
p.textContent=text;
result.appendChild(p);
}

async function checkDriver(user){

currentDriver=null;
form.hidden=true;
logoutBtn.hidden=false;
onlineBtn.hidden=true;

showMessage("আবেদনের অবস্থা যাচাই হচ্ছে...");

try{

const applicationRef=doc(db,"driverApplications",user.uid);
const applicationSnap=await getDoc(applicationRef);

if(!applicationSnap.exists()){
showMessage("এই অ্যাকাউন্টে চালকের আবেদন পাওয়া যায়নি।");
return;
}

const data=applicationSnap.data();

if(data.status==="pending"){
showMessage("আপনার আবেদন এখনো Pending। Admin অনুমোদনের জন্য অপেক্ষা করুন।","pending");
return;
}

if(data.status==="rejected"){
showMessage("আপনার আবেদন অনুমোদিত হয়নি। Admin-এর সঙ্গে যোগাযোগ করুন।","rejected");
return;
}

if(data.status!=="approved"){
showMessage("আবেদনের অবস্থা সঠিক নয়। Admin-এর সঙ্গে যোগাযোগ করুন।");
return;
}

currentDriver=user;

const presenceRef=doc(db,"driverPresence",user.uid);
const presenceSnap=await getDoc(presenceRef);

currentOnline=presenceSnap.exists()
&& presenceSnap.data().online===true;

const title=document.createElement("h3");
title.className="approved";
title.textContent="আপনার আবেদন অনুমোদিত হয়েছে!";

const info=document.createElement("p");
info.textContent="স্বাগতম, "+(data.fullName || "চালক")+
"। গাড়ির ধরন: "+(data.vehicleType==="bike"?"Bike":"Private Car");

result.replaceChildren(title,info);

onlineBtn.hidden=false;
updateOnlineDisplay();

}catch(error){

console.error(error);
currentDriver=null;
onlineBtn.hidden=true;
showMessage("আবেদনের অবস্থা যাচাই করা যায়নি। আবার চেষ্টা করুন।");

}

}

function updateOnlineDisplay(){

if(currentOnline){

showMessage("আপনি এখন ONLINE আছেন।","online");
onlineBtn.textContent="Offline হোন";

}else{

showMessage("আপনি এখন OFFLINE আছেন।","offline");
onlineBtn.textContent="Online হোন";

}

}

onlineBtn.onclick=async()=>{

if(!currentDriver || busy)return;

busy=true;
onlineBtn.disabled=true;

try{

const ref=doc(db,"driverPresence",currentDriver.uid);
const snap=await getDoc(ref);

const newStatus=!currentOnline;

if(snap.exists()){

await updateDoc(ref,{
online:newStatus,
updatedAt:serverTimestamp()
});

}else{

await setDoc(ref,{
uid:currentDriver.uid,
online:newStatus,
updatedAt:serverTimestamp()
});

}

currentOnline=newStatus;
updateOnlineDisplay();

}catch(error){

console.error(error);
showMessage("Status পরিবর্তন করা যায়নি। Firebase Rules পরীক্ষা করুন।");

}finally{

busy=false;
onlineBtn.disabled=false;

}

};

form.addEventListener("submit",async(event)=>{

event.preventDefault();

result.textContent="";
loginBtn.disabled=true;

try{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

const credential=await signInWithEmailAndPassword(
auth,email,password
);

await checkDriver(credential.user);

}catch(error){

console.error(error);
showMessage("Login হয়নি। Gmail ও Password পরীক্ষা করুন।");

}finally{

loginBtn.disabled=false;

}

});

onAuthStateChanged(auth,user=>{

if(!user){

currentDriver=null;
currentOnline=false;
form.hidden=false;
logoutBtn.hidden=true;
onlineBtn.hidden=true;
result.textContent="";

}

});

logoutBtn.onclick=async()=>{

await signOut(auth);
form.reset();

};

</script>
</body>
</html>
